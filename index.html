<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen">
<div id="encabezado"></div>
<main id="principal" class="flex-1 w-full pt-16 pb-8">
  <div class="max-w-7xl mx-auto w-full">
    <!-- 1. Banner principal -->
    <section id="hero" class="px-space-md lg:px-margin-desktop mt-space-sm" aria-label="Promociones">
      <div class="h-[420px] lg:h-80 rounded-xl esqueleto"></div>
    </section>

    <!-- 2. Búsqueda rápida + filtros -->
    <section class="px-space-md lg:px-margin-desktop mt-space-md flex flex-col gap-space-sm">
      <form id="formBusqueda" class="relative w-full lg:max-w-2xl" role="search">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline"><span class="material-symbols-outlined text-[20px]" aria-hidden="true">search</span></div>
        <input id="busquedaRapida" type="search" autocomplete="off" aria-label="Buscar productos" placeholder="Buscar por nombre, modelo o categoría..."
          class="w-full h-12 pl-10 pr-10 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all [&::-webkit-search-cancel-button]:hidden">
        <button type="button" id="limpiarBusqueda" aria-label="Limpiar búsqueda" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface"><span class="material-symbols-outlined text-[20px]" aria-hidden="true">cancel</span></button>
      </form>
      <div id="chips" class="flex items-center gap-space-xs overflow-x-auto no-scrollbar pb-1 -mx-space-md px-space-md lg:mx-0 lg:px-0" role="tablist" aria-label="Filtrar destacados"></div>
    </section>

    <!-- 3. Categorías destacadas -->
    <section class="mt-space-lg" aria-labelledby="tituloCategorias">
      <div class="px-space-md lg:px-margin-desktop flex items-center justify-between mb-space-xs">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[22px]" aria-hidden="true">category</span>
          <h2 id="tituloCategorias" class="font-headline-sm text-headline-sm text-on-surface">Categorías Destacadas</h2>
        </div>
        <a class="font-label-md text-label-md text-primary hover:underline flex items-center" href="categorias.html">Ver todas<span class="material-symbols-outlined text-[16px]" aria-hidden="true">chevron_right</span></a>
      </div>
      <div id="categorias" class="flex gap-space-sm overflow-x-auto no-scrollbar px-space-md lg:px-margin-desktop pt-1 pb-3">
        <div class="w-28 h-32 shrink-0 esqueleto rounded-xl"></div><div class="w-28 h-32 shrink-0 esqueleto rounded-xl"></div><div class="w-28 h-32 shrink-0 esqueleto rounded-xl"></div>
      </div>
    </section>

    <!-- 4. Productos destacados -->
    <section class="px-space-md lg:px-margin-desktop mt-space-md" aria-labelledby="tituloDestacados">
      <div class="flex items-center justify-between mb-space-sm">
        <div class="flex items-center gap-2">
          <span id="iconoDestacados" class="material-symbols-outlined text-secondary text-[22px]" aria-hidden="true">auto_awesome</span>
          <h2 id="tituloDestacados" class="font-headline-sm text-headline-sm text-on-surface">Productos Destacados</h2>
        </div>
        <span id="notaDestacados" class="font-label-sm text-label-sm text-on-surface-variant">Compra 1-clic</span>
      </div>
      <div id="destacados" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 lg:gap-6"></div>
      <div class="mt-space-md flex justify-center">
        <a id="verCatalogo" href="catalogo.html" class="h-11 px-5 rounded-xl bg-surface-container-lowest shadow-sm hover:bg-surface-container-low text-primary font-label-lg text-label-lg flex items-center gap-1.5 active:scale-[0.98] transition-all">Ver catálogo completo<span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span></a>
      </div>
    </section>

    <div class="lg:grid lg:grid-cols-2 lg:gap-6 lg:px-margin-desktop lg:items-start">
      <!-- 5. Beneficios -->
      <section id="beneficios" class="px-space-md lg:px-0 mt-space-lg"></section>
      <!-- 6. Reseñas -->
      <section id="resenas" class="px-space-md lg:px-0 mt-space-lg flex flex-col gap-space-sm"></section>
    </div>

    <!-- 7. Preguntas frecuentes -->
    <section class="px-space-md lg:px-margin-desktop mt-space-lg" aria-labelledby="tituloFaq">
      <div class="flex items-center gap-2 mb-space-sm">
        <span class="material-symbols-outlined text-primary text-[22px]" aria-hidden="true">help</span>
        <h2 id="tituloFaq" class="font-headline-sm text-headline-sm text-on-surface">Preguntas Frecuentes</h2>
      </div>
      <div id="faq" class="flex flex-col gap-space-xs lg:max-w-3xl"></div>
      <a href="soporte.html#preguntas" class="inline-flex items-center gap-1 mt-space-sm font-label-md text-label-md text-primary hover:underline">Ver todas las preguntas<span class="material-symbols-outlined text-[16px]" aria-hidden="true">chevron_right</span></a>
    </section>
  </div>
</main>
<div id="pie"></div>
</body>
</html>
