<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen">
<div id="encabezado"></div>
<main id="principal" class="flex-1 w-full pt-16 pb-6">
  <div class="max-w-7xl mx-auto w-full flex flex-col pb-6">
    <!-- Encabezado de sección -->
    <div class="px-margin lg:px-margin-desktop pt-3 pb-2 flex flex-col gap-1">
      <div class="inline-flex items-center gap-1.5 self-start px-2 py-0.5 rounded-full bg-surface-container-high text-primary font-label-sm text-label-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></span>Stock Verificado
      </div>
      <h1 id="tituloCatalogo" class="font-headline-lg-mobile text-headline-lg-mobile lg:font-headline-lg lg:text-headline-lg text-on-surface tracking-tight">Nuestro Catálogo Completo</h1>
      <p id="subtituloCatalogo" class="font-body-sm text-body-sm text-on-surface-variant">Explora los artículos disponibles para envío inmediato y atención por WhatsApp.</p>
    </div>

    <!-- Búsqueda (fija al hacer scroll) -->
    <div class="px-margin lg:px-margin-desktop py-2 sticky top-16 z-30 bg-surface/95 backdrop-blur-md">
      <form id="formBuscar" class="flex items-center gap-space-xs" role="search">
        <div class="relative flex-1 flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none" aria-hidden="true">search</span>
          <input id="buscar" type="search" autocomplete="off" aria-label="Buscar en el catálogo" placeholder="Buscar audífonos, mochilas, termos..."
            class="w-full h-11 pl-9 pr-9 rounded-xl bg-surface-container-lowest shadow-sm text-on-surface placeholder:text-outline text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all [&::-webkit-search-cancel-button]:hidden">
          <button type="button" id="limpiarBuscar" aria-label="Limpiar búsqueda" class="hidden absolute right-2.5 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">close</span></button>
        </div>
        <button type="button" id="botonFiltros" aria-expanded="false" aria-controls="panelFiltros" class="relative h-11 px-3.5 rounded-xl bg-surface-container-lowest shadow-sm flex items-center gap-1.5 text-on-surface active:scale-95 transition-transform">
          <span class="material-symbols-outlined text-[20px] text-primary" aria-hidden="true">tune</span>
          <span class="font-label-md text-label-md hidden xs:inline">Filtros</span>
          <span id="contadorFiltros" class="hidden w-5 h-5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center">0</span>
        </button>
      </form>
    </div>

    <!-- Panel de filtros -->
    <div id="panelFiltros" class="hidden px-margin lg:px-margin-desktop pb-3 pt-1"></div>

    <!-- Categorías -->
    <div class="w-full py-1 overflow-x-auto no-scrollbar">
      <div id="categorias" class="flex items-center gap-2 px-margin lg:px-margin-desktop w-max"></div>
    </div>

    <!-- Herramientas: orden, vista, filtros rápidos -->
    <div class="px-margin lg:px-margin-desktop pt-2.5 pb-1 flex flex-col gap-2">
      <div class="flex items-center justify-between gap-2">
        <div class="relative flex-1 max-w-[220px]">
          <label for="orden" class="sr-only">Ordenar por</label>
          <select id="orden" class="w-full h-9 pl-3 pr-8 rounded-lg bg-surface-container-lowest shadow-sm text-on-surface font-label-md text-label-md appearance-none focus:outline-none focus:ring-1 focus:ring-primary cursor-pointer">
            <option value="populares">Más Populares</option>
            <option value="menor">Menor Precio</option>
            <option value="mayor">Mayor Precio</option>
            <option value="nuevos">Novedades</option>
            <option value="nombre">Nombre (A-Z)</option>
          </select>
          <span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant text-[18px] pointer-events-none" aria-hidden="true">expand_more</span>
        </div>
        <div class="flex items-center p-0.5 rounded-lg bg-surface-container-lowest shadow-sm" role="group" aria-label="Vista">
          <button type="button" id="vistaCuadricula" aria-label="Vista de cuadrícula" class="w-8 h-8 rounded-md flex items-center justify-center transition-colors"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">grid_view</span></button>
          <button type="button" id="vistaLista" aria-label="Vista de lista" class="w-8 h-8 rounded-md flex items-center justify-center transition-colors"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">view_agenda</span></button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-2 pt-0.5">
        <div id="rapidos" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
        <span id="contador" class="font-label-sm text-label-sm text-on-surface-variant shrink-0 tnum" aria-live="polite"></span>
      </div>
    </div>

    <!-- Productos -->
    <div id="productos" class="px-margin lg:px-margin-desktop pt-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 lg:gap-5"></div>

    <!-- Paginación -->
    <div id="paginacion" class="px-margin pt-6 pb-4 flex flex-col items-center gap-3"></div>

    <!-- Banner conversacional -->
    <div class="px-margin lg:px-margin-desktop pt-2">
      <div class="p-3.5 rounded-2xl bg-surface-container-low shadow-sm flex items-center gap-3 relative overflow-hidden lg:max-w-2xl lg:mx-auto">
        <div class="w-11 h-11 rounded-xl bg-wa/20 text-wa-tinta flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[24px]" aria-hidden="true">contact_support</span></div>
        <div class="flex flex-col min-w-0 flex-1">
          <h3 class="font-label-lg text-label-lg text-on-surface font-bold leading-tight">¿Buscas algo específico?</h3>
          <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2 sm:truncate">Escríbenos directamente a WhatsApp y te lo cotizamos al instante.</p>
        </div>
        <a id="cotizar" data-wa-general target="_blank" rel="noopener" class="h-9 px-3 rounded-lg bg-wa hover:bg-wa-hover text-white font-label-md text-label-md flex items-center justify-center shrink-0 shadow-xs active:scale-95 transition-transform" href="#">Cotizar</a>
      </div>
    </div>
  </div>
</main>
<div id="pie"></div>
</body>
</html>
